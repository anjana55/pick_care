# Type-checks every workspace and runs the unit/component tests on each pull
# request and on main. The e2e suites (apps/api/test) need a MySQL database
# and are not run here; see docs/development.md for running them locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The API type-check alone needs about 1 GB of heap (see apps/api/Dockerfile).
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test
