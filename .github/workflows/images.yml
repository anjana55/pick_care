# Builds the three server images (api, web, public-web) on GitHub's machines
# and pushes them to GitHub Container Registry, so the production server
# downloads finished images instead of building them itself. Building on a
# small server ran it out of memory ("JavaScript heap out of memory") and
# slowed the live site for the length of the build.
#
# Images: ghcr.io/<owner>/<repo>-<service>:<first 12 characters of the commit>
# - the same tag update.sh gives a release, so the server can ask for exactly
# the commit it is deploying. update.sh falls back to building on the server
# when an image isn't here (this workflow failed, a PR deploy, --build-here).
#
# One-time setup, in the repo's Settings > Secrets and variables > Actions >
# Variables:
#   NEXT_PUBLIC_API_URL  Required. The same value as in the server's
#                        .env.production (e.g. https://pickcare.lk/api). The
#                        web images have it built in; update.sh checks the
#                        image's copy against the server's and builds there
#                        instead if they differ.
#   IMAGE_PLATFORMS      Optional. Default linux/amd64. Set linux/arm64 for an
#                        ARM server (e.g. AWS Graviton).
# Then on the server: IMAGE_REGISTRY=ghcr.io/<owner>/<repo> in
# .env.production (DEPLOYMENT.md, "Prebuilt images").
name: Build server images

on:
  push:
    branches: [main]
  # Actions tab > Build server images > Run workflow: rebuild main, e.g.
  # after changing NEXT_PUBLIC_API_URL.
  workflow_dispatch:
  # A pull request that changes how the images are built (Dockerfiles, the
  # Node version, dependencies) builds all three to prove they still build.
  # Nothing is pushed for a pull request.
  pull_request:
    paths:
      - 'apps/*/Dockerfile'
      - '.dockerignore'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/*/package.json'
      - 'packages/shared/package.json'
      - '.github/workflows/images.yml'

permissions:
  contents: read
  packages: write

# A newer push to main supersedes an older build still running.
concurrency:
  group: server-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One app failing must not stop the others: update.sh uses what is here
      # and builds the rest on the server.
      fail-fast: false
      matrix:
        service: [api, web, public-web]
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tag
        id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Check the API address is set
        if: matrix.service != 'api' && github.event_name != 'pull_request'
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the repository variable NEXT_PUBLIC_API_URL (Settings > Secrets and variables > Actions > Variables) to the value in the server's .env.production. The web images have it built in."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
        if: ${{ vars.IMAGE_PLATFORMS && vars.IMAGE_PLATFORMS != 'linux/amd64' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.image }}:main
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://example.invalid/api' }}
            NODE_BUILD_HEAP_MB=4096
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            lk.pickcare.api-url=${{ vars.NEXT_PUBLIC_API_URL }}
          # Layer cache kept by GitHub between runs, per app: an unchanged
          # package-lock.json skips `npm ci`.
          cache-from: type=gha,scope=${{ matrix.service }}
          # Pull requests read the cache but don't write it, so main's stays clean.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.service) || '' }}

  # Old images pile up with every merge. Keep the newest 15 of each app: the
  # server keeps its own copies of what it ran (rollback never downloads).
  prune:
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, public-web]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}-${{ matrix.service }}
          package-type: container
          min-versions-to-keep: 15
        continue-on-error: true
